name: Atletismo CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4  # Actualizado a v4

    - name: Set up Python 3.14.2
      uses: actions/setup-python@v5 # Actualizado a v5
      with:
        python-version: "3.14.2" # Tu versión actual
        cache: 'pip'

    - name: Install system dependencies (Qt/PySide6)
      run: |
        sudo apt-get update
        # Paquetes actualizados para Ubuntu 22.04/24.04
        sudo apt-get install -y libegl1 libgl1-mesa-dev libxkbcommon-x11-0 libdbus-1-3 xvfb

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        # Instalamos directamente las que necesitamos
        pip install pytest pytest-qt PySide6 openpyxl

    - name: Run Tests with pytest (using xvfb)
      run: |
        # xvfb-run simula el entorno gráfico para PySide6
        xvfb-run -a pytest tests/ -v
      
  release:
    needs: build-and-test

    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14.2
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.2"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 openpyxl pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          # Usamos --paths=src para que encuentre los módulos internos
          # El separador ; es obligatorio para Windows
          python -m PyInstaller --noconsole --onefile --paths=src --icon="assets/logo.ico" --add-data="assets/logo.png;assets" main.py --name "Atletismo"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          # Sube el ejecutable generado en la carpeta dist/
          files: dist/Atletismo.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
